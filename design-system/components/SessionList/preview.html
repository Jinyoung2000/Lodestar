<!-- @dsCard group="Shell" height=300 subtitle="행 28px, 들여쓰기 16px" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>SessionList</title>
<style>
body{margin:0;background:var(--surface-raised);font-family:var(--font-sans);color:var(--fg)}
.list{width:var(--size-sidebar);padding:var(--space-2) 0;display:flex;flex-direction:column}
.label{height:var(--size-row-lg);display:flex;align-items:center;padding:0 var(--space-3);font:600 11px/16px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--fg-subtle)}
.row{height:var(--size-row-lg);display:flex;align-items:center;gap:var(--space-1_5);margin:0 var(--space-1);padding:0 var(--space-2);border-radius:var(--radius-sm);font-size:12px;line-height:18px;cursor:pointer;white-space:nowrap}
.row:hover{background:var(--surface-hover)}
.row.sel{background:var(--surface-selected);color:var(--fg-strong)}
.row .t{overflow:hidden;text-overflow:ellipsis;flex:1}
.row .m{font-size:11px;color:var(--fg-subtle)}
.l1{padding-left:calc(var(--space-2) + var(--space-4))}
.l2{padding-left:calc(var(--space-2) + var(--space-4) * 2)}
.dot{width:6px;height:6px;border-radius:var(--radius-full);flex:none}
.dot.run{background:var(--running)}.dot.wait{background:var(--warning)}.dot.none{background:transparent}
svg{width:16px;height:16px;stroke:var(--fg-muted);stroke-width:1.5;fill:none;flex:none}
</style></head>
<body>
<div class="list">
  <div class="label">Sessions</div>
  <div class="row"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg><span class="t">app</span></div>
  <div class="row l1 sel"><span class="dot run"></span><span class="t">PR 병합 최종 점검</span><span class="m">2m</span></div>
  <div class="row l1"><span class="dot wait"></span><span class="t">EventPubSub 남은 패턴 제거</span><span class="m">1h</span></div>
  <div class="row l2"><span class="dot none"></span><span class="t">Forked: 기존 invalidate 사례</span></div>
  <div class="row"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg><span class="t">app-client</span></div>
  <div class="row l1"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 8v8M18 10c0 4-6 4-12 6"/></svg><span class="t">feature/JOBL-4258</span><span class="m">wt</span></div>
  <div class="row l1"><span class="dot none"></span><span class="t">알바 실험실 디자인 구현</span><span class="m">3d</span></div>
</div>
</body>
</html>
