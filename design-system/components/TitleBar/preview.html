<!-- @dsCard group="Shell" height=72 subtitle="35px, 신호등 자리 78px" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>TitleBar</title>
<style>
body{margin:0;background:var(--surface-raised);font-family:var(--font-sans);color:var(--fg)}
.bar{height:var(--size-titlebar);display:flex;align-items:center;gap:var(--space-1);padding:0 var(--space-2) 0 78px;border-bottom:1px solid var(--border-subtle);position:relative}
.lights{position:absolute;left:var(--space-3);display:flex;gap:var(--space-2)}
.lights span{width:12px;height:12px;border-radius:var(--radius-full);background:var(--border)}
.ib{width:var(--size-control-sm);height:var(--size-control-sm);border:0;border-radius:var(--radius-sm);background:transparent;color:var(--fg-muted);display:grid;place-items:center;cursor:pointer}
.ib:hover{background:var(--surface-hover);color:var(--fg)}
.search{position:absolute;left:50%;transform:translateX(-50%);width:360px;height:var(--size-control-sm);display:flex;align-items:center;justify-content:center;gap:var(--space-1_5);border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-overlay);color:var(--fg-muted);font-size:12px}
.right{margin-left:auto;display:flex;align-items:center;gap:var(--space-1)}
.sync{height:var(--size-control-sm);padding:0 var(--space-2);border:0;border-radius:var(--radius-sm);background:var(--accent);color:var(--accent-fg);font:600 12px/18px var(--font-sans);display:flex;align-items:center;gap:var(--space-1)}
svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body>
<div class="bar">
  <div class="lights" aria-hidden="true"><span></span><span></span><span></span></div>
  <button class="ib" aria-label="사이드바 토글"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
  <button class="ib" aria-label="뒤로"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button class="ib" aria-label="앞으로"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg>app</div>
  <div class="right">
    <button class="sync"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5l2 2M20 12a8 8 0 0 1-14 5l-2-2"/></svg>Sync 2↑</button>
    <button class="ib" aria-label="아래 패널"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 14h18"/></svg></button>
    <button class="ib" aria-label="오른쪽 패널"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
  </div>
</div>
</body>
</html>
