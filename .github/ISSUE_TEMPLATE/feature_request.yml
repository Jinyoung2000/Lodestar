name: Feature request
description: Suggest an improvement to Lodestar.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please write your issue in English.
        Keep the request focused on one problem or workflow.
        For security problems, follow the [security policy](https://github.com/Jinyoung2000/Lodestar/security/policy) instead of opening a public issue.
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues for similar requests.
          required: true
        - label: I am writing this issue in English.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the workflow or limitation you want to improve and who it affects.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like Lodestar to behave and how that would help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Describe other approaches or workarounds you have tried or considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional. Add examples or screenshots that explain the request. Remove tokens, credentials, private file paths, personal information and private conversation content before posting.
